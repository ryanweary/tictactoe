<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1e1b2e">
<title>Tic Tac Toe</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#1e1b2e;color:#f4f4f8;padding:16px}
  h1{margin:0 0 12px;font-size:28px;letter-spacing:1px}
  .scores{display:flex;gap:10px;width:100%;max-width:360px;margin-bottom:14px}
  .score{flex:1;background:#2c2842;border-radius:14px;padding:10px;text-align:center;border:2px solid transparent;transition:border-color .2s}
  .score.active{border-color:#8b7cf6}
  .score .label{font-size:13px;opacity:.75}
  .score .num{font-size:28px;font-weight:700}
  .x{color:#ff6b8b}.o{color:#4dd6c1}
  #status{font-size:20px;min-height:28px;margin-bottom:14px;font-weight:600}
  .board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:8px;width:min(100%,360px);height:min(calc(100vw - 32px),360px)}
  .cell{background:#2c2842;border:none;border-radius:16px;font-size:64px;line-height:1;font-weight:800;color:inherit;padding:0;margin:0;
    width:100%;height:100%;min-width:0;min-height:0;overflow:hidden;font-family:inherit;
    display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s,transform .1s}
  .cell:active{transform:scale(.96)}
  .cell.x{color:#ff6b8b}.cell.o{color:#4dd6c1}
  .cell.win{background:#4a3f86}
  .buttons{display:flex;gap:10px;width:100%;max-width:360px;margin-top:18px}
  button.btn{flex:1;padding:14px;font-size:16px;font-weight:600;border:none;border-radius:14px;cursor:pointer;color:#fff}
  .new{background:#8b7cf6}.reset{background:#3b3656}
</style>
</head>
<body>
  <h1>Tic Tac Toe</h1>
  <div class="scores">
    <div class="score" id="sx"><div class="label">Player <span class="x">X</span></div><div class="num x" id="scoreX">0</div></div>
    <div class="score" id="sd"><div class="label">Draws</div><div class="num" id="scoreD">0</div></div>
    <div class="score" id="so"><div class="label">Player <span class="o">O</span></div><div class="num o" id="scoreO">0</div></div>
  </div>
  <div id="status"></div>
  <div class="board" id="board"></div>
  <div class="buttons">
    <button class="btn new" id="newGame">New Game</button>
    <button class="btn reset" id="resetScores">Reset Points</button>
  </div>
<script>
  const LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  const $=id=>document.getElementById(id);
  const boardEl=$('board'), statusEl=$('status');
  let board, turn, over, starter='X';
  let scores={X:0,O:0,D:0};
  try{const saved=JSON.parse(localStorage.getItem('ttt-scores2'));if(saved&&typeof saved.X==='number')scores=saved;}catch(e){}
  const cells=[];
  for(let i=0;i<9;i++){const c=document.createElement('button');c.className='cell';c.addEventListener('click',()=>play(i));boardEl.appendChild(c);cells.push(c);}
  function save(){localStorage.setItem('ttt-scores2',JSON.stringify(scores));}
  function renderScores(){
    $('scoreX').textContent=scores.X;$('scoreO').textContent=scores.O;$('scoreD').textContent=scores.D;
    $('sx').classList.toggle('active',!over&&turn==='X');$('so').classList.toggle('active',!over&&turn==='O');
  }
  function mark(p){return `<span class="${p.toLowerCase()}">${p}</span>`;}
  function winnerLine(){return LINES.find(l=>board[l[0]]&&board[l[0]]===board[l[1]]&&board[l[1]]===board[l[2]]);}
  function newGame(){
    board=Array(9).fill(null);turn=starter;over=false;
    cells.forEach(c=>{c.textContent='';c.className='cell';});
    statusEl.innerHTML=`${mark(turn)}'s turn`;renderScores();
  }
  function play(i){
    if(over||board[i])return;
    board[i]=turn;cells[i].textContent=turn;cells[i].classList.add(turn.toLowerCase());
    const line=winnerLine();
    if(line){
      over=true;const w=board[line[0]];line.forEach(k=>cells[k].classList.add('win'));
      scores[w]+=1;statusEl.innerHTML=`${mark(w)} wins! 🎉`;
    }else if(board.every(v=>v!==null)){
      over=true;scores.D+=1;statusEl.textContent="It's a draw";
    }else{
      turn=turn==='X'?'O':'X';statusEl.innerHTML=`${mark(turn)}'s turn`;
    }
    if(over){save();starter=starter==='X'?'O':'X';}
    renderScores();
  }
  $('newGame').addEventListener('click',newGame);
  $('resetScores').addEventListener('click',()=>{
    if(confirm('Reset all points to zero?')){scores={X:0,O:0,D:0};save();renderScores();}
  });
  newGame();
</script>
</body>
</html>
